<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f1"><title>镜间 · 试戴</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#25362f;font-family:'Microsoft YaHei',system-ui,sans-serif}header{max-width:1120px;margin:auto;padding:25px 24px;display:flex;align-items:center;justify-content:space-between}header b{font-size:23px;letter-spacing:.18em}header span{font-size:13px;color:#718178}main{max-width:1120px;margin:auto;padding:28px 24px 60px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.eyebrow{font-size:13px;letter-spacing:.18em;color:#8a7555;font-weight:bold}h1{font-size:clamp(30px,4vw,48px);letter-spacing:.05em;margin:10px 0}p{line-height:1.7;color:#69776e}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:26px}.panel{background:#fff;border:1px solid #e6e9e3;border-radius:22px;overflow:hidden}.view{aspect-ratio:4/3;background:#e9ede6;position:relative;display:grid;place-items:center;overflow:hidden}.view video,.view canvas{position:absolute;width:100%;height:100%;object-fit:cover}.view video{transform:scaleX(-1)}.view canvas{pointer-events:none}.face-guide{position:absolute;width:42%;height:70%;border:3px dashed rgba(255,255,255,.9);border-radius:48% 48% 46% 46%;box-shadow:0 0 0 2px rgba(28,55,42,.3);pointer-events:none;display:none}.face-guide.found{border-color:#bfe5be;border-style:solid}.placeholder{text-align:center;padding:30px;color:#65736a}.placeholder .icon{font-size:54px}.status{background:#f9faf7;padding:14px 20px;color:#586b5f;font-size:15px}.side{padding:28px}.product{display:flex;gap:18px;align-items:center;border:1px solid #eceee9;padding:12px;border-radius:16px}.product img{width:120px;height:90px;object-fit:contain}.tag{color:#94794b;font-size:12px;letter-spacing:.08em}.product h2{font-size:22px;margin:8px 0}.product p{margin:0;font-size:14px}.buttons{display:grid;gap:12px;margin-top:24px}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:16px 20px;font-size:18px;font-weight:650}button:focus-visible{outline:3px solid #b48f5b;outline-offset:3px}.primary{background:#294b3c;color:white}.secondary{background:#edf2eb;color:#294b3c}.controls{display:flex;align-items:center;gap:12px;margin-top:20px}input[type=range]{flex:1;accent-color:#426853}.note{font-size:14px;color:#667469;border-top:1px solid #eef0ec;padding-top:18px;margin-top:24px}.pictures{display:flex;gap:12px;margin-top:18px}.pictures img{width:50%;height:95px;object-fit:contain;background:#fafaf8;border-radius:10px}button:disabled{opacity:.5;cursor:not-allowed}.foot{font-size:13px;color:#89958c;margin-top:20px}@media(max-width:760px){header{padding:20px}.intro{display:block}.layout{grid-template-columns:1fr}.side{padding:22px}main{padding:12px 16px 40px}.view{aspect-ratio:1}.intro p{margin-bottom:0}}
</style></head><body><header><b>镜间</b><span>自在挑选 · 从容试戴</span></header><main><div class="intro"><div><div class="eyebrow">VIRTUAL TRY-ON · 试戴体验</div><h1>看见适合自己的样子</h1><p>用镜头试一试这副圆框眼镜，找到你喜欢的感觉。</p></div></div><div class="layout"><section class="panel"><div class="view"><video id="video" playsinline muted></video><canvas id="canvas"></canvas><div id="guide" class="face-guide" aria-hidden="true"></div><div id="placeholder" class="placeholder"><div class="icon">◌</div><p>点击「打开摄像头」<br>将脸部对准屏幕，就可以开始试戴</p></div></div><div class="status" id="status" role="status">点击“打开摄像头”，将脸放进虚线框</div></section><section class="panel side"><div class="tag">本次试戴 · 01</div><div class="product"><img src="front.png" alt="黑色圆框眼镜正面"><div><h2>经典圆框</h2><p>黑色镜框 · 简约轻盈</p></div></div><div class="buttons"><button class="primary" id="start">打开摄像头</button><button class="secondary" id="snap" disabled>保存试戴照片</button></div><div class="controls"><label for="scale">调整大小</label><input type="range" id="scale" min="0.75" max="1.35" step="0.01" value="1"><span id="scaleVal">100%</span></div><div class="note">取景框只是引导，不必完全贴合。请摘下旧眼镜或请家人帮忙操作；镜框大小仅供参考，可手动调整。</div><div class="pictures"><img src="front.png" alt="镜框正面照片"><img src="side.png" alt="镜框侧面照片"></div><div class="foot">照片留在本机；保存按钮会下载到你的设备。</div></section></div></main><script type="module">
const $=id=>document.getElementById(id), video=$('video'), canvas=$('canvas'), ctx=canvas.getContext('2d'), status=$('status'), img=new Image();img.src='frame.png';let detector,stream,running=false,frame=0,smoothed=null;
$('scale').oninput=e=>$('scaleVal').textContent=Math.round(e.target.value*100)+'%';
function size(){const rect=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr)}
async function load(){status.textContent='正在加载识别组件，请稍候…';const {FaceLandmarker,FilesetResolver}=await import('./vision_bundle.mjs');const fs=await FilesetResolver.forVisionTasks('./wasm');status.textContent='正在加载人脸识别模型，首次使用可能较慢…';return FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'./face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1})}
function timeout(p,ms){let timer;return Promise.race([p,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('识别模型加载超时，请检查网络后重试')),ms)})]).finally(()=>clearTimeout(timer))}
function draw(){if(!running)return;frame=requestAnimationFrame(draw);if(video.readyState<2)return;const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);let result;try{result=detector.detectForVideo(video,performance.now())}catch(e){running=false;stream?.getTracks().forEach(t=>t.stop());$('start').textContent='重新打开摄像头';$('snap').disabled=true;status.textContent='人脸识别出错，请重新打开摄像头';return}const p=result.faceLandmarks?.[0];if(!p){smoothed=null;$('guide').classList.remove('found');status.textContent='正在寻找人脸，请将脸朝向镜头并放入框内';return}$('guide').classList.add('found');status.textContent='已识别到脸，可以轻轻转头；镜框大小可调整';const vw=video.videoWidth,vh=video.videoHeight,fit=Math.max(W/vw,H/vh),ox=(W-vw*fit)/2,oy=(H-vh*fit)/2;const xy=i=>({x:W-(ox+p[i].x*vw*fit),y:oy+p[i].y*vh*fit});let a=xy(33),b=xy(263);let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),angle=Math.atan2(dy,dx);if(angle>Math.PI/2)angle-=Math.PI;if(angle< -Math.PI/2)angle+=Math.PI;let target={x:(a.x+b.x)/2,y:(a.y+b.y)/2,w:dist*1.65*Number($('scale').value),angle};if(!smoothed)smoothed=target;else for(const k of ['x','y','w','angle'])smoothed[k]+=(target[k]-smoothed[k])*.28;if(img.complete&&img.naturalWidth){let h=smoothed.w*img.naturalHeight/img.naturalWidth;ctx.save();ctx.translate(smoothed.x,smoothed.y);ctx.rotate(smoothed.angle);ctx.drawImage(img,-smoothed.w/2,-h*.46,smoothed.w,h);ctx.restore()}}
$('start').onclick=async()=>{if(running){running=false;cancelAnimationFrame(frame);stream?.getTracks().forEach(t=>t.stop());ctx.clearRect(0,0,canvas.width,canvas.height);$('placeholder').style.display='block';$('guide').style.display='none';$('guide').classList.remove('found');smoothed=null;$('start').textContent='打开摄像头';$('snap').disabled=true;status.textContent='摄像头已关闭';return}try{$('start').disabled=true;status.textContent='正在请求摄像头权限，请在弹窗中允许使用…';if(!navigator.mediaDevices?.getUserMedia)throw Error('请在支持摄像头的安全网页中打开');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();$('placeholder').style.display='none';$('guide').style.display='block';status.textContent='摄像头已打开，正在准备识别…';if(!detector)detector=await timeout(load(),30000);if(!img.complete||!img.naturalWidth)throw Error('眼镜素材未加载');size();$('placeholder').style.display='none';running=true;$('start').textContent='关闭摄像头';$('snap').disabled=false;draw()}catch(e){stream?.getTracks().forEach(t=>t.stop());video.srcObject=null;$('placeholder').style.display='block';$('guide').style.display='none';status.textContent='暂时无法启动：'+e.message+'。请检查摄像头权限与网络后重试。'}finally{$('start').disabled=false}};
$('snap').onclick=()=>{const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d'),W=out.width,H=out.height,fit=Math.max(W/video.videoWidth,H/video.videoHeight),w=video.videoWidth*fit,h=video.videoHeight*fit;c.save();c.translate(W,0);c.scale(-1,1);c.drawImage(video,(W-w)/2,(H-h)/2,w,h);c.restore();c.drawImage(canvas,0,0);const a=document.createElement('a');a.download='我的眼镜试戴.png';a.href=out.toDataURL('image/png');a.click()};window.addEventListener('resize',()=>{if(running)size()});
</script></body></html>
